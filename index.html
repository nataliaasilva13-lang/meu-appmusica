<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify Clone - App</title>
  
  <!-- Configurações para o PWA no iPhone / iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1db954">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spotify Clone">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/174/174872.png">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-spotify"></i>
        <h2>Spotify Clone</h2>
      </div>
      
      <div style="font-size: 10px; color: #888; background: #181818; padding: 6px; border-radius: 4px; text-align: center; border: 1px solid #333;">
        Projeto Acadêmico
      </div>

      <div class="user-info">
        <span>Usuário:</span>
        <strong id="user-email-display">Carregando...</strong>
      </div>

      <div class="sidebar-actions">
        <button id="btn-open-modal" class="btn-primary">+ Nova Música</button>
        <button id="btn-logout" class="btn-danger btn-logout">Sair</button>
      </div>
    </aside>

    <main class="main-content">
      <header>
        <h1>Sua Biblioteca</h1>
        <div class="search-container">
          <input 
            type="search" 
            id="search-input" 
            placeholder="O que você quer ouvir?..."
          >
        </div>
      </header>

      <section class="song-grid" id="song-grid">
        <!-- Áreas das músicas -->
      </section>
    </main>
  </div>

  <!-- Player de Áudio Rodapé -->
  <footer class="player-bar">
    <div class="track-info">
      <img id="player-cover" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 24 24' fill='%231db954'><rect width='100%' height='100%' fill='%23282828'/><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" alt="Capa" class="player-album-art">
      <div class="track-text">
        <span id="player-title">Nenhuma música tocando</span>
        <span id="player-artist">-</span>
      </div>
    </div>

    <div class="player-controls">
      <audio id="audio-player" controls style="max-width: 100%;"></audio>
    </div>

    <div class="volume-container">
      <button id="btn-mute" class="btn-icon" title="Mudar Mudo">
        <i id="volume-icon" class="fa-solid fa-volume-high"></i>
      </button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
    </div>
  </footer>

  <!-- Modal Adicionar Música -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="btn-close-modal" class="close">&times;</span>
      <h2>Adicionar Música</h2>
      
      <form id="song-form">
        <label for="song-name">Nome da Música:</label>
        <input type="text" id="song-name" required placeholder="Ex: Shape of You">

        <label for="song-style">Artista / Estilo:</label>
        <input type="text" id="song-style" required placeholder="Ex: Ed Sheeran">

        <label for="song-genre">Gênero:</label>
        <input type="text" id="song-genre" required placeholder="Ex: Pop">

        <label for="song-cover-file">Capa do Álbum (Imagem):</label>
        <input type="file" id="song-cover-file" accept="image/*">

        <label for="song-file">Arquivo MP3:</label>
        <input type="file" id="song-file" accept="audio/mp3, audio/mpeg" required>

        <button type="submit" class="btn-primary" id="btn-save">Salvar na Playlist</button>
      </form>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
  <script type="module" src="./firebaseconfig.js"></script>
  <script type="module" src="crud.js"></script>
</body>
</html>
